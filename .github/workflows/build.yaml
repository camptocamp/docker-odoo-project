name: build

on:
  push:
    branches:
      - "audit_vulnerabilities"

env:
  COMPOSE_BAKE: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  TARGET: GHCR

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        odoo_serie:
          - "19.0"
        git_tag:
          - "latest"
          - "5.5.6"
          - "5.5.4"
          - "5.5.3"
        python:
          - "python:3.12"
        flavor:
          - main
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/camptocamp/docker-odoo-project
          flavor: |
            prefix=${{ matrix.odoo_serie }}-${{ matrix.flavor == 'core' && 'core-' || '' }},onlatest=true

      - name: Setup build dir
        id: setup
        run: |
          VERSION=${{ matrix.odoo_serie }} SRC=build make setup
          echo "Dockerfile=./build/${{ matrix.flavor == 'core' && 'core.' || '' }}Dockerfile" >> $GITHUB_OUTPUT
          echo "python-from=ghcr.io/camptocamp/docker-odoo-project:${{ matrix.odoo_serie }}-${{ matrix.git_tag }}" >> $GITHUB_OUTPUT
          echo "image-tag=ci-${{ matrix.flavor == 'core' && 'core-' || '' }}latest:${{ matrix.odoo_serie }}-${{ matrix.git_tag }}" >> $GITHUB_OUTPUT
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./build
          file: ${{ steps.setup.outputs.Dockerfile }}
          build-args: |
            VERSION=${{ matrix.odoo_serie }}
          build-contexts: |
            python=docker-image://${{ steps.setup.outputs.python-from }}
          push: false
          load: true
          tags: ${{ steps.setup.outputs.image-tag  }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      - name: Scan image
        id: scan
        uses: sysdiglabs/scan-action@v6
        with:
          sysdig-secure-url: https://eu1.app.sysdig.com
          stop-on-failed-policy-eval: false
          stop-on-processing-error: false
          image-tag: ${{ steps.setup.outputs.image-tag }}
          skip-upload: false
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
